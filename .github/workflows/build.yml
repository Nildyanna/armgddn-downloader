name: Build ARMGDDN Downloader

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      windows_only:
        description: 'Build only the Windows installer (skips macOS and Linux) for a quick private test'
        type: boolean
        default: false

jobs:
  build:
    # Dependabot version bumps are tested locally before merging, so they do not spend Linux/macOS minutes here.
    if: github.actor != 'dependabot[bot]' && inputs.windows_only != true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e "const fs=require('fs'); const tag=process.env.GITHUB_REF_NAME||''; const v=tag.replace(/^v/,''); if(!/^\d+\.\d+\.\d+/.test(v)) { console.error('Invalid tag version:', tag); process.exit(1);} const files=['package.json','package-lock.json']; for(const f of files){ if(!fs.existsSync(f)) continue; const j=JSON.parse(fs.readFileSync(f,'utf8')); j.version=v; if(j.packages && j.packages[''] && typeof j.packages[''] === 'object'){ j.packages[''].version=v; } fs.writeFileSync(f, JSON.stringify(j, null, 2)+'\n','utf8'); } console.log('Set version to', v);"

      - name: Download bundled help video (GitHub Release asset)
        shell: bash
        run: |
          mkdir -p assets
          curl \
            --fail \
            --location \
            --http1.1 \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 20 \
            --output assets/newmultipartzip.mp4 \
            https://github.com/Nildyanna/armgddn-downloader/releases/download/assets-v1/newmultipartzip.mp4

      - name: Download rclone (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p rclone/linux
          wget -q https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q rclone-current-linux-amd64.zip
          mv rclone-*-linux-amd64/rclone rclone/linux/rclone
          chmod +x rclone/linux/rclone
          rm -rf rclone-*-linux-amd64*

      - name: Download rclone (macOS)
        if: matrix.platform == 'mac'
        run: |
          mkdir -p rclone/darwin
          curl -L -o rclone.zip https://downloads.rclone.org/rclone-current-osx-amd64.zip
          unzip -q rclone.zip
          mv rclone-*-osx-amd64/rclone rclone/darwin/rclone
          chmod +x rclone/darwin/rclone
          rm -rf rclone-*-osx-amd64 rclone.zip

      - name: Generate macOS icon.icns
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          mkdir -p build/icon.iconset
          sips -z 16 16     assets/icon.png --out build/icon.iconset/icon_16x16.png
          sips -z 32 32     assets/icon.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icon.png --out build/icon.iconset/icon_32x32.png
          sips -z 64 64     assets/icon.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icon.png --out build/icon.iconset/icon_128x128.png
          sips -z 256 256   assets/icon.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icon.png --out build/icon.iconset/icon_256x256.png
          sips -z 512 512   assets/icon.png --out build/icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/icon.png --out build/icon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/icon.png --out build/icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/icon.iconset -o build/icon.icns
          rm -rf build/icon.iconset

      - name: Build Electron app (Linux)
        if: matrix.platform == 'linux'
        run: npm run build:linux -- --publish never

      # Launch the packaged app in smoke-test mode: real window + UI load,
      # bundled rclone, and a real rclone download from a local server.
      # A failure here blocks the release job.
      - name: Smoke test packaged app (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        env:
          ARMGDDN_SMOKE_TEST: '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
          exe="$(find dist/linux-unpacked -maxdepth 1 -type f -executable ! -name '*.so*' ! -name 'chrome*' | head -n 1)"
          echo "Smoke testing $exe"
          timeout 180 xvfb-run -a "$exe" --no-sandbox 2>&1 | tee smoke.log
          grep -q '\[smoke\] PASS' smoke.log

      - name: Build Electron app (macOS)
        if: matrix.platform == 'mac'
        run: npm run build:mac -- --publish never

      - name: Smoke test packaged app (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          ARMGDDN_SMOKE_TEST: '1'
        run: |
          export ARMGDDN_SMOKE_RESULT="$PWD/smoke-result.txt"
          app="$(find dist -maxdepth 2 -name '*.app' -type d | head -n 1)"
          exe="$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -n 1)"
          echo "Smoke testing $exe"
          # macOS runners have no coreutils timeout; background + kill instead
          "$exe" > smoke.log 2>&1 &
          pid=$!
          for i in $(seq 1 180); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          cat smoke-result.txt 2>/dev/null || { echo "no smoke result written"; tail -50 smoke.log; }
          grep -q '\[smoke\] PASS' smoke-result.txt

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 1

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v7
        with:
          name: mac-build
          path: |
            dist/*.pkg
          retention-days: 1

  build-win32:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e "const fs=require('fs'); const tag=process.env.GITHUB_REF_NAME||''; const v=tag.replace(/^v/,''); if(!/^\d+\.\d+\.\d+/.test(v)) { console.error('Invalid tag version:', tag); process.exit(1);} const files=['package.json','package-lock.json']; for(const f of files){ if(!fs.existsSync(f)) continue; const j=JSON.parse(fs.readFileSync(f,'utf8')); j.version=v; if(j.packages && j.packages[''] && typeof j.packages[''] === 'object'){ j.packages[''].version=v; } fs.writeFileSync(f, JSON.stringify(j, null, 2)+'\n','utf8'); } console.log('Set version to', v);"

      - name: Download bundled help video (GitHub Release asset)
        shell: bash
        run: |
          mkdir -p assets
          curl \
            --fail \
            --location \
            --http1.1 \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 20 \
            --output assets/newmultipartzip.mp4 \
            https://github.com/Nildyanna/armgddn-downloader/releases/download/assets-v1/newmultipartzip.mp4

      - name: Download rclone (Windows)
        shell: bash
        run: |
          mkdir -p rclone/win32
          curl -L -o rclone.zip https://downloads.rclone.org/rclone-current-windows-amd64.zip
          unzip -q rclone.zip
          mv rclone-*-windows-amd64/rclone.exe rclone/win32/rclone.exe
          rm -rf rclone-*-windows-amd64 rclone.zip

      - name: Build Electron app (Windows)
        run: npm run build:win -- --publish never

      - name: Smoke test packaged app (Windows)
        shell: bash
        env:
          ARMGDDN_SMOKE_TEST: '1'
        run: |
          export ARMGDDN_SMOKE_RESULT="$PWD/smoke-result.txt"
          exe="$(ls dist/win-unpacked/*.exe | grep -vi 'uninstall' | head -n 1)"
          echo "Smoke testing $exe"
          timeout 180 "$exe" || true
          cat smoke-result.txt || echo "no smoke result written (app crashed or hung)"
          grep -q '\[smoke\] PASS' smoke-result.txt

      - name: Upload artifacts (Windows)
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            dist/*.exe
          retention-days: 1

  release:
    needs:
      - build
      - build-win32
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' && needs.build-win32.result == 'success' }}
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-build
          path: ./artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: ./artifacts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: mac-build
          path: ./artifacts

      - name: List artifacts
        run: find ./artifacts -type f -ls

      - name: Sign release artifacts (Ed25519)
        shell: bash
        env:
          UPDATE_ED25519_PRIVKEY_PEM: ${{ secrets.UPDATE_ED25519_PRIVKEY_PEM }}
        run: |
          set -euo pipefail

          if [ -z "${UPDATE_ED25519_PRIVKEY_PEM:-}" ]; then
            echo "Missing required secret UPDATE_ED25519_PRIVKEY_PEM" >&2
            exit 1
          fi

          KEY_PATH="${RUNNER_TEMP}/update-ed25519-priv.pem"
          printf "%s" "${UPDATE_ED25519_PRIVKEY_PEM}" > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"

          shopt -s nullglob
          for f in ./artifacts/*.deb ./artifacts/*.AppImage ./artifacts/*.exe ./artifacts/*.pkg; do
            [ -f "$f" ] || continue
            echo "Signing $f"
            openssl pkeyutl -sign -inkey "${KEY_PATH}" -rawin -in "$f" -out "${f}.sig.bin"
            base64 -w0 "${f}.sig.bin" > "${f}.sig"
            rm -f "${f}.sig.bin"
          done

      - name: Create release README.txt
        shell: bash
        run: |
          cat > ./artifacts/README.txt <<'EOF'
          ARMGDDN Downloader ${{ github.ref_name }}

          Installation

          Windows:
          - Download the .exe installer
          - Run the installer

          macOS:
          - Download the .pkg
          - Run the installer
          - If the app doesn't work after install, run Fix.command:
            1) Open Fix.command
            2) If macOS blocks it, go to System Settings -> Privacy & Security and allow Fix.command
            3) Run it and enter your password in Terminal when prompted
          - To avoid security prompts for end users, the app must be signed with an Apple Developer ID certificate and notarized.

          Linux (Debian/Ubuntu):
          - Download .deb file
          - Install: sudo dpkg -i armgddn-downloader_*.deb

          Linux (Universal):
          - Download .AppImage file
          - Make executable: chmod +x ARMGDDN*.AppImage
          - Run: ./ARMGDDN*.AppImage

          EOF

      - name: Stage Fix.command for release
        shell: bash
        run: |
          cp ./build/Fix.command ./artifacts/Fix.command

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "ARMGDDN Downloader ${{ github.ref_name }}"
          body: |
            ## ARMGDDN Downloader ${{ github.ref_name }}
            
            ### Installation
            
            **Windows:**
            - Download the `.exe` installer
            - Run the installer

            **macOS:**
            - Download the `.pkg`
            - Run the installer
            - If the app doesn't work after install, run `Fix.command`:
              1) Open `Fix.command`
              2) If macOS blocks it, go to `System Settings` -> `Privacy & Security` and allow `Fix.command`
              3) Run it and enter your password in Terminal when prompted
            - To avoid security prompts for end users, the app must be signed with an Apple Developer ID certificate and notarized.
            
            **Linux (Debian/Ubuntu):**
            - Download `.deb` file
            - Install: `sudo dpkg -i armgddn-downloader_*.deb`
            
            **Linux (Universal):**
            - Download `.AppImage` file
            - Make executable: `chmod +x ARMGDDN*.AppImage`
            - Run: `./ARMGDDN*.AppImage`

          files: |
            artifacts/README.txt
            artifacts/Fix.command
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.exe
            artifacts/*.pkg
            artifacts/*.sig
          draft: false
          prerelease: false

      - name: Delete temporary build artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")
          mapfile -t artifact_ids < <(jq -r '.artifacts[] | select(.name == "linux-build" or .name == "mac-build" or .name == "windows-build") | .id' <<< "$artifacts")
          if ((${#artifact_ids[@]} == 0)); then
            echo "No temporary build artifacts found."
            exit 0
          fi
          for artifact_id in "${artifact_ids[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            echo "Deleted temporary artifact ${artifact_id}."
          done
