<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Add to My Komga</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e5e7eb; margin: 0; padding: 18px; }
  h2 { margin: 0 0 6px; font-size: 1.1rem; }
  p { margin: 0 0 12px; font-size: 0.85rem; color: #9ca3af; line-height: 1.4; }
  label { display: block; font-size: 0.85rem; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 8px; border: 1px solid #334155; background: #111827; color: #e5e7eb; }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  button { padding: 8px 14px; border-radius: 8px; border: 1px solid #334155; background: #1f2937; color: #e5e7eb; cursor: pointer; }
  button.go { background: #16a34a; border-color: #16a34a; color: white; }
  #err { color: #f87171; font-size: 0.85rem; min-height: 1.2em; margin-top: 8px; }
</style>
</head>
<body>
<h2>Connect your Komga</h2>
<p>Enter your Komga address and an API key (in Komga: Account Settings, API Keys, Add). They are saved on this PC only and are used only to talk to your own Komga.</p>
<label for="url">Komga address</label>
<input id="url" type="text" spellcheck="false" />
<label for="key">API key</label>
<input id="key" type="password" autocomplete="off" spellcheck="false" />
<div id="err"></div>
<div class="row">
  <button type="button" id="cancel">Cancel</button>
  <button type="button" id="save" class="go">Save and add</button>
</div>
<script>
  const url = document.getElementById('url'), key = document.getElementById('key'), err = document.getElementById('err');
  window.komgaAPI.getDefaults().then(d => { url.value = (d && d.url) || 'http://localhost:25600'; key.focus(); });
  document.getElementById('cancel').onclick = () => window.komgaAPI.cancel();
  async function save() {
    const r = await window.komgaAPI.submit({ url: url.value, key: key.value });
    if (r && r.error) err.textContent = r.error;
  }
  document.getElementById('save').onclick = save;
  key.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
</script>
</body>
</html>
